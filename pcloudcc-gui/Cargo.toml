[package]
name = "pcloudcc-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27"
egui = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
dirs = "5.0"
nix = { version = "0.29", features = ["process", "signal"] }

[patch.crates-io]
winit = { git = "https://github.com/rust-windowing/winit", tag = "v0.29.15" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
