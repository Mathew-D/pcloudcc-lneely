[package]
name = "pcloudcc-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "=0.27.2"
egui = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
ksni = { version = "0.3", features = ["blocking"] }

[patch.crates-io]
eframe = { path = "vendor/eframe" }
winit = { git = "https://github.com/rust-windowing/winit", tag = "v0.29.15" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
